name: Publicar Spa Serenidad en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar para el subdirectorio de GitHub Pages
        run: npm run build -- --base-href /spa-reservas-angular/
      - name: Preparar fallback del router Angular
        run: cp dist/spa-reservas-angular/browser/index.html dist/spa-reservas-angular/browser/404.html
      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spa-reservas-angular/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
