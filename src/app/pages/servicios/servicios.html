<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h3 mb-0">Servicios del spa</h1>
</div>

<div class="card card-body shadow-sm mb-3">
  <div class="row g-2">
    <div class="col-12 col-md-6">
      <label class="form-label small text-muted" for="buscar">Buscar</label>
      <input id="buscar" type="search" class="form-control" placeholder="Nombre o descripción..."
             [value]="busqueda()" (input)="busqueda.set($any($event.target).value)">
    </div>
    <div class="col-8 col-md-4">
      <label class="form-label small text-muted" for="categoria">Categoría</label>
      <select id="categoria" class="form-select" [value]="categoria()"
              (change)="categoria.set($any($event.target).value)">
        <option value="todas">Todas</option>
        @for (c of categorias; track c) {
          <option [value]="c">{{ c | titlecase }}</option>
        }
      </select>
    </div>
    <div class="col-4 col-md-2 d-grid align-items-end">
      <button type="button" class="btn btn-outline-secondary" (click)="limpiar()">Limpiar</button>
    </div>
  </div>
</div>

@if (errorCarga()) {
  <div class="alert alert-danger" role="alert">{{ errorCarga() }} <button class="btn btn-outline-danger btn-sm" (click)="ngOnInit()">Reintentar</button></div>
} @else if (cargando()) {
  <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
} @else {
  <p class="text-muted small">{{ filtrados().length }} servicio(s) encontrado(s)</p>
  <div class="row g-3">
    @for (s of filtrados(); track s.id) {
      <div class="col-12 col-sm-6 col-lg-4">
        <app-servicio-card [servicio]="s" (reservar)="irAReservar($event)" />
      </div>
    } @empty {
      <div class="col-12">
        <div class="alert alert-warning mb-0">No hay servicios que coincidan con la búsqueda y la categoría elegidas.</div>
      </div>
    }
  </div>
}
