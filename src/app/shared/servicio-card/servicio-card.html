<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <span class="badge align-self-start mb-2" [ngClass]="colores[servicio().categoria]">
      {{ servicio().categoria | titlecase }}
    </span>
    <h2 class="h5 card-title">{{ servicio().nombre | titlecase }}</h2>
    <p class="card-text text-muted flex-grow-1">{{ servicio().descripcion }}</p>
    <p class="mb-3">
      <span class="text-muted">{{ servicio().duracionMin }} min</span> ·
      <strong>{{ servicio().precio | currency:'BOB':'symbol-narrow' }}</strong>
    </p>
    <button type="button" class="btn btn-primary w-100" (click)="reservar.emit(servicio())">
      Reservar
    </button>
  </div>
</div>
